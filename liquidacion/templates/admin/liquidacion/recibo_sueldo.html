{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recibo de haberes</title>
  <link rel="stylesheet" href="{% static 'liquidacion/admin/recibo_svg_viewer.css' %}">
</head>
<body>
  <nav id="toolbar" aria-label="Controles del recibo">
    <button type="button" id="imprimir">Imprimir</button>
    <a id="descargar-pdf" href="{{ pdf_url }}" download>Descargar PDF</a>
    <span class="separador" aria-hidden="true"></span>
    <button type="button" id="alejar" aria-label="Alejar">−</button>
    <output id="nivel-zoom" aria-live="polite">100%</output>
    <button type="button" id="acercar" aria-label="Acercar">+</button>
    <button type="button" id="restablecer">Ajustar</button>
    <button type="button" id="alternar-lupa" aria-pressed="false">Lupa</button>
  </nav>
  <main id="visor" aria-label="Visor del recibo">
    <div id="contenedor-recibo">{{ svg_markup|safe }}</div>
    <div id="lupa" aria-hidden="true"><svg id="lupa-contenido"></svg></div>
  </main>
  <p id="ayuda-visor">Usá la rueda para acercar o alejar. Arrastrá el recibo para recorrerlo.</p>
  <script src="{% static 'liquidacion/admin/recibo_svg_viewer.js' %}" defer></script>
</body>
</html>
